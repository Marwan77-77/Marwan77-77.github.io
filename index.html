<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>رسالة خاصة 💖</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffb6c1, #ffe4e1);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* شاشة كلمة السر */
#lock {
  background: rgba(255,255,255,0.9);
  padding: 30px;
  border-radius: 20px;
  text-align: center;
}

#lock input {
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  margin-top: 10px;
}

/* الهينت */
#hintBtn {
  position: fixed;
  bottom: 15px;
  left: 15px;
  font-size: 12px;
  color: #fff;
  background: rgba(255, 111, 145, 0.85);
  padding: 6px 10px;
  border-radius: 10px;
  cursor: pointer;
  user-select: none;
}

/* الكارت */
.card {
  display: none;
  background: rgba(255,255,255,0.9);
  padding: 30px;
  border-radius: 20px;
  width: 400px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

button {
  background: #ff6f91;
  color: white;
  border: none;
  padding: 12px 22px;
  border-radius: 25px;
  cursor: pointer;
  margin-top: 15px;
}

/* صفحة المفاجأة */
#surprisePage {
  display: none;
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #ffe4e1, #ffb6c1);
  padding: 40px;
  overflow: hidden;
}

/* قلوب متحركة */
.floating-heart {
  position: absolute;
  font-size: 22px;
  opacity: 0.5;
  animation: float 6s infinite ease-in-out;
}

@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
  100% { transform: translateY(0); }
}

/* توزيع المحتوى */
.surprise-content {
  display: flex;
  height: 100%;
  gap: 40px;
  align-items: center;
  position: relative;
  z-index: 2;
}

/* الرسالة (شمال) */
.message-box {
  flex: 1;
}

.message-box h2 {
  color: #000;
  margin-bottom: 20px;
  font-size: 26px;
}

.message-text {
  font-size: clamp(18px, 2.6vw, 32px);
  color: #000;
  line-height: 1.9;
}

/* الصور (يمين) */
.slider {
  flex: 1;
  height: 80%;
  position: relative;
  border-radius: 30px;
  overflow: hidden;
  box-shadow: 0 12px 35px rgba(255,111,145,0.5);
}

.slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  transform: scale(1.08);
  transition: opacity 1.2s ease, transform 1.2s ease;
}

.slide.active {
  opacity: 1;
  transform: scale(1);
}

.slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
</style>
</head>

<body>

<div id="hintBtn" onclick="alert('💡 تلميح: كلمة السر حاجة بينا بس 😉')">
  💡 hint ya habla
</div>

<!-- كلمة السر -->
<div id="lock">
  <h3>💌 كلمة السر</h3>
  <input type="password" id="password" placeholder="اكتبيها هنا">
  <br><br>
  <button onclick="unlock()">دخول</button>
</div>

<!-- الكارت -->
<div class="card" id="card">
  <h2>💗 رسالة ليكي 💗</h2>
  <p>⏳ عدى <span id="days"></span> يوم من أول يوم شفتك فيه</p>
  <button onclick="openSurprise()">اضغطي هنا 🎁</button>
</div>

<!-- صفحة المفاجأة -->
<div id="surprisePage">

  <!-- القلوب -->
  <div class="floating-heart" style="top:20px; left:30px;">❤️</div>
  <div class="floating-heart" style="top:80px; right:60px;">❤️</div>
  <div class="floating-heart" style="bottom:50px; left:100px;">❤️</div>
  <div class="floating-heart" style="bottom:80px; right:120px;">❤️</div>
  <div class="floating-heart" style="top:40%; left:10px;">❤️</div>
  <div class="floating-heart" style="top:60%; right:20px;">❤️</div>

  <div class="surprise-content">

    <!-- الرسالة -->
    <div class="message-box">
      <h2>📩 رسالة من قلبي</h2>
      <p class="message-text">
        هنا تكتب رسالتك 💕  
        الكلام هيبقى متظبط  
        والخط بيكبر ويصغر لوحده  
        وعلى البينك الرومانسي  
        زي ما كنت عايز بالظبط ❤️
      </p>
    </div>

    <!-- الصور -->
    <div class="slider">
      <div class="slide active">
        <img src="photo1.jpg">
      </div>
      <div class="slide">
        <img src="photo2.jpg">
      </div>
      <div class="slide">
        <img src="photo3.jpg">
      </div>
    </div>

  </div>
</div>

<script>
const correctPassword = "ice coffee";

function unlock() {
  if (password.value === correctPassword) {
    lock.style.display = "none";
    card.style.display = "block";
  } else {
    alert("كلمة السر غلط ❌");
  }
}

const startDate = new Date("2024-01-01");
days.innerText = Math.ceil((new Date() - startDate) / 86400000);

function openSurprise() {
  card.style.display = "none";
  surprisePage.style.display = "block";
}

const slides = document.querySelectorAll(".slide");
let current = 0;

setInterval(() => {
  slides[current].classList.remove("active");
  current = (current + 1) % slides.length;
  slides[current].classList.add("active");
}, 3500);
</script>

</body>
</html>
