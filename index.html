<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع رومانسي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #ff69b4, #ffb6c1);
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #login {
            display: block;
        }
        #main {
            display: none;
        }
        #gift-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }
        #gift-content {
            display: flex;
            width: 80%;
            height: 80%;
        }
        #gift-message {
            flex: 1;
            padding: 20px;
            font-size: 2em;
            text-align: center;
            background: #fff;
            color: #333;
            border-radius: 10px;
            margin-right: 10px;
        }
        #gift-image {
            flex: 1;
            background: #fff;
            border-radius: 10px;
            margin-left: 10px;
        }
        #gift-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #hint-btn {
            background: red;
            color: white;
            position: absolute;
            bottom: 20px;
            right: 20px;
        }
        #countdown {
            font-size: 2em;
            margin: 20px;
        }
        #gift-btn {
            background: pink;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="login">
        <h1>أدخل كلمة المرور الرومانسية</h1>
        <input type="password" id="password" placeholder="كلمة المرور">
        <br>
        <button onclick="checkPassword()">دخول</button>
        <button id="hint-btn" onclick="showHint()">💡 هينت</button>
    </div>

    <div id="main">
        <h1>مرحبًا في موقعنا الرومانسي! 💕</h1>
        <div id="countdown"></div>
        <button id="gift-btn" onclick="showGift()">🎁 هدية</button>
        <audio id="song" loop autoplay>
            <source src="https://youtu.be/LfLwGZheB88?si=nIUAC7GmjDfY7uFK" type="audio/mpeg"> <!-- غير هذا الرابط إلى رابط أغنيتك -->
        </audio>
    </div>

    <div id="gift-overlay" onclick="hideGift()">
        <div id="gift-content">
            <div id="gift-message">رسالة رومانسية كبيرة هنا! 💖</div> <!-- غير هذا النص -->
            <div id="gift-image">
                <img src="https://example.com/your-image.jpg" alt="صورة هدية"> <!-- غير هذا الرابط إلى رابط صورتك -->
            </div>
        </div>
    </div>

    <script>
        const correctPassword = "password123"; // غير كلمة المرور هنا
        const hintText = "الهينت: شيء رومانسي مثل اسمك!"; // غير الهينت هنا
        const daysToCount = 30; // غير عدد الأيام هنا
        const giftMessage = "رسالة رومانسية كبيرة هنا! 💖"; // غير الرسالة هنا
        const giftImageSrc = "https://example.com/your-image.jpg"; // غير رابط الصورة هنا

        function checkPassword() {
            const password = document.getElementById('password').value;
            if (password === correctPassword) {
                document.getElementById('login').style.display = 'none';
                document.getElementById('main').style.display = 'block';
                startCountdown();
                document.getElementById('song').play(); // تشغيل الأغنية تلقائيًا
            } else {
                alert('كلمة مرور خاطئة!');
            }
        }

        function showHint() {
            alert(hintText);
        }

        function startCountdown() {
            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + daysToCount);
            const countdownElement = document.getElementById('countdown');

            const interval = setInterval(() => {
                const now = new Date().getTime();
                const distance = targetDate - now;

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                countdownElement.innerHTML = `الوقت المتبقي: ${days} يوم ${hours} ساعة ${minutes} دقيقة ${seconds} ثانية`;

                if (distance < 0) {
                    clearInterval(interval);
                    countdownElement.innerHTML = "انتهى الوقت! 🎉";
                }
            }, 1000);
        }

        function showGift() {
            document.getElementById('gift-message').innerText = giftMessage;
            document.getElementById('gift-image').querySelector('img').src = giftImageSrc;
            document.getElementById('gift-overlay').style.display = 'flex';
        }

        function hideGift() {
            document.getElementById('gift-overlay').style.display = 'none';
        }
    </script>
</body>
</html>
