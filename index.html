<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>رسالة خاصة 💖</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffb6c1, #ffe4e1);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* شاشة كلمة السر */
#lock {
  background: rgba(255,255,255,0.9);
  padding: 30px;
  border-radius: 20px;
  text-align: center;
}

#lock input {
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  margin-top: 10px;
}

/* الكارت الأساسي */
.card {
  display: none;
  background: rgba(255,255,255,0.85);
  padding: 30px;
  border-radius: 20px;
  width: 400px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

/* زر */
button {
  background: #ff6f91;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 20px;
  cursor: pointer;
  margin-top: 15px;
}

/* صفحة المفاجأة */
#surprisePage {
  display: none;
  position: fixed;
  inset: 0;
  background: #fff;
  padding: 40px;
}

.surprise-content {
  display: flex;
  height: 100%;
  gap: 30px;
}

/* الرسالة */
.message-box {
  flex: 1;
  text-align: left;
  max-width: 500px;
}

.message-box h2 {
  margin-bottom: 15px;
}

.message-text {
  font-size: clamp(16px, 2.5vw, 28px);
  color: #ff4d6d;
  line-height: 1.7;
  word-wrap: break-word;
  overflow-wrap: break-word;
  white-space: normal;
}

/* الصورة */
.image-box {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

.image-box img {
  max-width: 100%;
  max-height: 100%;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<!-- شاشة كلمة السر -->
<div id="lock">
  <h3>💌 كلمة السر</h3>
  <input type="password" id="password" placeholder="اكتبيها هنا">
  <br><br>
  <button onclick="unlock()">دخول</button>
</div>

<!-- الكارت -->
<div class="card" id="card">
  <h2>💗 رسالة ليكي 💗</h2>

  <p>⏳ عدى <span id="days"></span> يوم من أول يوم شفتك فيه</p>

  <button onclick="openSurprise()">اضغطي هنا 🎁</button>
</div>

<!-- صفحة المفاجأة -->
<div id="surprisePage">
  <div class="surprise-content">

    <!-- الرسالة -->
    <div class="message-box">
      <h2>📩 هنا تكتب الرسالة الكبيرة اللي من قلبك ❤️</h2>
      <p class="message-text">
        هنا تحط الرسالة الطويلة براحتك  
        مهما كانت كبيرة هتتظبط لوحدها  
        وتطلع شيك ومش بعرض الشاشة 💖
      </p>
    </div>

    <!-- الصورة -->
    <div class="image-box">
      <!-- غير اسم الصورة -->
      <img src="photo.jpg" alt="صورة المفاجأة">
    </div>

  </div>
</div>

<script>
/* كلمة السر */
const correctPassword = "ice coffee";

function unlock() {
  const pass = document.getElementById("password").value;
  if (pass === correctPassword) {
    document.getElementById("lock").style.display = "none";
    document.getElementById("card").style.display = "block";
  } else {
    alert("كلمة السر غلط ❌");
  }
}

/* العداد */
const startDate = new Date("2024-01-01");
const today = new Date();
const diffDays = Math.ceil((today - startDate) / (1000*60*60*24));
document.getElementById("days").innerText = diffDays;

/* فتح صفحة المفاجأة */
function openSurprise() {
  document.getElementById("card").style.display = "none";
  document.getElementById("surprisePage").style.display = "block";
}
</script>

</body>
</html>
