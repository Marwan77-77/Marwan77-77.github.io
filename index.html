<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Special Page</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111, #1f1f1f);
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box, .content-box {
      background: rgba(255,255,255,0.08);
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      width: 400px;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
    }

    input {
      padding: 10px;
      width: 80%;
      border-radius: 8px;
      border: none;
      margin-top: 15px;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    .hint-btn {
      position: fixed;
      bottom: 15px;
      right: 15px;
      background: red;
      color: white;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      font-size: 18px;
    }

    .hidden {
      display: none;
    }

    .gift-btn {
      background: #ff4081;
      color: white;
    }

    .gift-box {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .gift-content {
      display: flex;
      width: 80%;
      height: 70%;
    }

    .gift-image {
      width: 50%;
      background-size: cover;
      background-position: center;
    }

    .gift-message {
      width: 50%;
      padding: 40px;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="login-box" id="loginBox">
  <h2>اكتب كلمة السر</h2>
  <input type="password" id="password" placeholder="Password">
  <br>
  <button onclick="checkPassword()">دخول</button>
</div>

<button class="hint-btn" onclick="alert('الهينت: اكتب الهينت هنا')">?</button>

<div class="content-box hidden" id="mainContent">
  <h2 id="counter"></h2>
  <button class="gift-btn" onclick="openGift()">🎁 هدية</button>
</div>

<div class="gift-box" id="giftBox" onclick="closeGift()">
  <div class="gift-content">
    <div class="gift-message" id="giftMessage">
      اكتب رسالتك هنا
    </div>
    <div class="gift-image" id="giftImage"></div>
  </div>
</div>

<audio id="song" src="song.mp3"></audio>

<script>
  const correctPassword = "1234"; // غير كلمة السر هنا

  function checkPassword() {
    const input = document.getElementById("password").value;
    if (input === correctPassword) {
      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("mainContent").classList.remove("hidden");
      document.getElementById("song").play();
      startCounter();
    } else {
      alert("كلمة السر غلط");
    }
  }

  // عداد الأيام
  const startDate = new Date("2024-01-01"); // غير التاريخ هنا

  function startCounter() {
    const today = new Date();
    const diff = today - startDate;
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    document.getElementById("counter").innerText = days + " يوم مع بعض";
  }

  function openGift() {
    document.getElementById("giftBox").style.display = "flex";
  }

  function closeGift() {
    document.getElementById("giftBox").style.display = "none";
  }

  // حط صورة الهدية هنا
  document.getElementById("giftImage").style.backgroundImage = "url('your-image.jpg')";
</script>

</body>
</html>
