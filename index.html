<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>رسالة خاصة 💖</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffb6c1, #ffe4e1);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* الهينت */
#hintBtn {
  position: fixed;
  bottom: 15px;
  left: 15px;
  font-size: 12px;
  color: #fff;
  background: rgba(255,111,145,0.9);
  padding: 6px 10px;
  border-radius: 10px;
  cursor: pointer;
}

/* شاشة كلمة السر */
#lock {
  background: rgba(255,255,255,0.95);
  padding: 30px;
  border-radius: 20px;
  text-align: center;
}

/* الكارت */
.card {
  display: none;
  background: rgba(255,255,255,0.95);
  padding: 30px;
  border-radius: 25px;
  width: 400px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  position: relative;
}

/* قلوب حوالين الكارت */
.card .heart {
  position: absolute;
  font-size: 22px;
}

.card .heart.tl { top: -12px; left: -12px; }
.card .heart.tr { top: -12px; right: -12px; }
.card .heart.bl { bottom: -12px; left: -12px; }
.card .heart.br { bottom: -12px; right: -12px; }

/* زرار */
button {
  background: #ff6f91;
  color: white;
  border: none;
  padding: 12px 22px;
  border-radius: 25px;
  cursor: pointer;
  margin-top: 15px;
}

/* صفحة المفاجأة */
#surprisePage {
  display: none;
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #ffb6c1, #ffe4e1);
  justify-content: center;
  align-items: center;
}

/* كارت المفاجأة */
.surprise-card {
  background: rgba(255,255,255,0.45);
  border-radius: 35px;
  padding: 40px;
  width: 85%;
  height: 75%;
  position: relative;
  display: flex;
  gap: 40px;
}

/* قلوب صفحة المفاجأة (زي الأولى بالظبط) */
.surprise-card .heart {
  position: absolute;
  font-size: 24px;
}

.surprise-card .heart.tl { top: -15px; left: -15px; }
.surprise-card .heart.tr { top: -15px; right: -15px; }
.surprise-card .heart.bl { bottom: -15px; left: -15px; }
.surprise-card .heart.br { bottom: -15px; right: -15px; }

/* الرسالة */
.message-box {
  flex: 1;
  color: #000;
}

.message-box h2 {
  margin-bottom: 20px;
}

.message-text {
  font-size: clamp(18px, 2.6vw, 32px);
  line-height: 1.8;
}

/* الصور */
.slider {
  flex: 1;
  border-radius: 25px;
  overflow: hidden;
  position: relative;
}

.slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 1s ease;
}

.slide.active {
  opacity: 1;
}

.slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
</style>
</head>

<body>

<div id="hintBtn" onclick="alert('💡 تلميح: كلمة السر حاجة بينا بس 😉')">
  💡 hint ya habla
</div>

<!-- كلمة السر -->
<div id="lock">
  <h3>💌 كلمة السر</h3>
<input type="password" id="password" placeholder="اكتبيها هنا">  
  <br><br>
  <button onclick="unlock()">دخول</button>
</div>

<!-- الكارت -->
<div class="card" id="card">
  <span class="heart tl">❤️</span>
  <span class="heart tr">❤️</span>
  <span class="heart bl">❤️</span>
  <span class="heart br">❤️</span>

  <h2>💖 رسالة ليكي</h2>
  <p>⏳ عدى <span id="days"></span> يوم من أول يوم شفتك فيه</p>
  <button onclick="openSurprise()">اضغطي هنا 🎁</button>
</div>

<!-- صفحة المفاجأة -->
<div id="surprisePage">
  <div class="surprise-card">

    <span class="heart tl">❤️</span>
    <span class="heart tr">❤️</span>
    <span class="heart bl">❤️</span>
    <span class="heart br">❤️</span>

    <div class="message-box">
      <h2>📩 رسالة من قلبي</h2>
      <p class="message-text">
        هنا تكتب الرسالة الكبيرة ❤️  
        الكلام هيترتب تحت بعضه  
        والخط بيكبر ويصغر تلقائي  
        وعلى نفس الستايل الرومانسي
      </p>
    </div>

    <div class="slider">
      <div class="slide active"><img src="photo1.jpg"></div>
      <div class="slide"><img src="photo2.jpg"></div>
      <div class="slide"><img src="photo3.jpg"></div>
    </div>

  </div>
</div>

<script>
const correctPassword = "ice coffee";

function unlock() {
  if (password.value === correctPassword) {
    lock.style.display = "none";
    card.style.display = "block";
  }
}

days.innerText = Math.ceil((new Date() - new Date("2024-01-01")) / 86400000);

function openSurprise() {
  card.style.display = "none";
  surprisePage.style.display = "flex";
}

const slides = document.querySelectorAll(".slide");
let i = 0;
setInterval(() => {
  slides[i].classList.remove("active");
  i = (i + 1) % slides.length;
  slides[i].classList.add("active");
}, 3500);
</script>

</body>
</html>
