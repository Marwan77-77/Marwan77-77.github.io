<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>رسالة خاصة 💖</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffb6c1, #ffe4e1);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* شاشة كلمة السر */
#lock {
  background: rgba(255,255,255,0.9);
  padding: 30px;
  border-radius: 20px;
  text-align: center;
}

#lock input {
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  margin-top: 10px;
}

/* الكارت */
.card {
  display: none;
  background: rgba(255,255,255,0.9);
  padding: 30px;
  border-radius: 20px;
  width: 400px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

/* زر */
button {
  background: #ff6f91;
  color: white;
  border: none;
  padding: 12px 22px;
  border-radius: 25px;
  cursor: pointer;
  margin-top: 15px;
  font-size: 15px;
}

button:hover {
  background: #ff4d6d;
}

/* صفحة المفاجأة */
#surprisePage {
  display: none;
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #ffe4e1, #ffb6c1);
  padding: 40px;
}

/* الكارت الكبير */
.surprise-card {
  background: rgba(255,255,255,0.92);
  border-radius: 30px;
  padding: 40px;
  height: 100%;
  box-shadow: 0 15px 40px rgba(0,0,0,0.15);
}

/* المحتوى */
.surprise-content {
  display: flex;
  height: 100%;
  gap: 40px;
}

/* الرسالة */
.message-box {
  flex: 1;
  text-align: left;
}

.message-box h2 {
  color: #ff4d6d;
  margin-bottom: 20px;
}

.message-text {
  font-size: clamp(18px, 2.5vw, 30px);
  color: #ff6f91;
  line-height: 1.8;
  word-wrap: break-word;
  white-space: normal;
}

/* الصورة */
.image-box {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

.image-box img {
  max-width: 100%;
  max-height: 100%;
  border-radius: 25px;
  box-shadow: 0 10px 30px rgba(255,111,145,0.4);
}

/* قلوب خفيفة */
.heart {
  position: absolute;
  color: #ff6f91;
  font-size: 20px;
  opacity: 0.4;
}

.heart.one { top: 20px; left: 30px; }
.heart.two { top: 40px; right: 40px; }
.heart.three { bottom: 30px; left: 60px; }
.heart.four { bottom: 40px; right: 50px; }
</style>
</head>

<body>

<!-- شاشة كلمة السر -->
<div id="lock">
  <h3>💌 كلمة السر</h3>
  <input type="password" id="password" placeholder="اكتبيها هنا">
  <br><br>
  <button onclick="unlock()">دخول</button>
</div>

<!-- الكارت -->
<div class="card" id="card">
  <h2>💗 رسالة ليكي 💗</h2>

  <p>⏳ عدى <span id="days"></span> يوم من أول يوم شفتك فيه</p>

  <button onclick="openSurprise()">اضغطي هنا 🎁</button>
</div>

<!-- صفحة المفاجأة -->
<div id="surprisePage">
  <div class="heart one">❤️</div>
  <div class="heart two">❤️</div>
  <div class="heart three">❤️</div>
  <div class="heart four">❤️</div>

  <div class="surprise-card">
    <div class="surprise-content">

      <!-- الرسالة -->
      <div class="message-box">
        <h2>📩 رسالة من قلبي</h2>
        <p class="message-text">
          هنا تكتب الرسالة الكبيرة اللي من قلبك ❤️  
          مهما كانت طويلة أو قصيرة  
          هتفضل شكلها شيك ومرتبة  
          زي إحساسك بالظبط 💕
        </p>
      </div>

      <!-- الصورة -->
      <div class="image-box">
        <img src="photo.jpg" alt="صورة المفاجأة">
      </div>

    </div>
  </div>
</div>

<script>
const correctPassword = "ice coffee";

function unlock() {
  const pass = document.getElementById("password").value;
  if (pass === correctPassword) {
    document.getElementById("lock").style.display = "none";
    document.getElementById("card").style.display = "block";
  } else {
    alert("كلمة السر غلط ❌");
  }
}

/* العداد */
const startDate = new Date("2024-01-01");
const today = new Date();
const diffDays = Math.ceil((today - startDate) / (1000*60*60*24));
document.getElementById("days").innerText = diffDays;

/* فتح المفاجأة */
function openSurprise() {
  document.getElementById("card").style.display = "none";
  document.getElementById("surprisePage").style.display = "block";
}
</script>

</body>
</html>
