<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>رسالة خاصة 💖</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffb6c1, #ffe4e1);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* شاشة كلمة السر */
#lock {
  background: rgba(255,255,255,0.9);
  padding: 30px;
  border-radius: 20px;
  text-align: center;
}

#lock input {
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  margin-top: 10px;
}

/* الكارت */
.card {
  display: none;
  background: rgba(255,255,255,0.9);
  padding: 30px;
  border-radius: 20px;
  width: 400px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

button {
  background: #ff6f91;
  color: white;
  border: none;
  padding: 12px 22px;
  border-radius: 25px;
  cursor: pointer;
  margin-top: 15px;
  font-size: 15px;
}

/* صفحة المفاجأة */
#surprisePage {
  display: none;
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #ffe4e1, #ffb6c1);
  padding: 40px;
}

/* الكارت الكبير */
.surprise-card {
  background: rgba(255,255,255,0.92);
  border-radius: 30px;
  padding: 40px;
  height: 100%;
  box-shadow: 0 15px 40px rgba(0,0,0,0.15);
}

/* المحتوى */
.surprise-content {
  display: flex;
  height: 100%;
  gap: 40px;
}

/* الرسالة */
.message-box {
  flex: 1;
}

.message-box h2 {
  color: #ff4d6d;
  margin-bottom: 20px;
}

.message-text {
  font-size: clamp(18px, 2.5vw, 30px);
  color: #ff6f91;
  line-height: 1.8;
  white-space: normal;
  word-wrap: break-word;
}

/* سلايدر الصور */
.slider {
  flex: 1;
  position: relative;
  border-radius: 25px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(255,111,145,0.4);
}

.slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  transform: scale(1.05);
  transition: opacity 1.2s ease, transform 1.2s ease;
}

.slide.active {
  opacity: 1;
  transform: scale(1);
}

.slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* قلوب خفيفة */
.heart {
  position: absolute;
  color: #ff6f91;
  font-size: 20px;
  opacity: 0.4;
}

.heart.one { top: 20px; left: 30px; }
.heart.two { top: 40px; right: 40px; }
.heart.three { bottom: 30px; left: 60px; }
.heart.four { bottom: 40px; right: 50px; }
</style>
</head>

<body>

<!-- شاشة كلمة السر -->
<div id="lock">
  <h3>💌 كلمة السر</h3>
  <input type="password" id="password" placeholder="اكتبيها هنا">
  <br><br>
  <button onclick="unlock()">دخول</button>
</div>

<!-- الكارت -->
<div class="card" id="card">
  <h2>💗 رسالة ليكي 💗</h2>
  <p>⏳ عدى <span id="days"></span> يوم من أول يوم شفتك فيه</p>
  <button onclick="openSurprise()">اضغطي هنا 🎁</button>
</div>

<!-- صفحة المفاجأة -->
<div id="surprisePage">
  <div class="heart one">❤️</div>
  <div class="heart two">❤️</div>
  <div class="heart three">❤️</div>
  <div class="heart four">❤️</div>

  <div class="surprise-card">
    <div class="surprise-content">

      <!-- الرسالة -->
      <div class="message-box">
        <h2>📩 رسالة من قلبي</h2>
        <p class="message-text">
          هنا تكتب الرسالة الكبيرة اللي من قلبك ❤️  
          مهما طولت أو قصرت  
          هتفضل شكلها هادي ومرتب  
          زي إحساسك بالظبط 💕
        </p>
      </div>

      <!-- سلايدر الصور -->
      <div class="slider">
        <div class="slide active">
          <img src="photo1.jpg">
        </div>
        <div class="slide">
          <img src="photo2.jpg">
        </div>
        <div class="slide">
          <img src="photo3.jpg">
        </div>
      </div>

    </div>
  </div>
</div>

<script>
const correctPassword = "ice coffee";

function unlock() {
  if (password.value === correctPassword) {
    lock.style.display = "none";
    card.style.display = "block";
  } else {
    alert("كلمة السر غلط ❌");
  }
}

/* العداد */
const startDate = new Date("2024-01-01");
days.innerText = Math.ceil((new Date() - startDate) / 86400000);

/* فتح المفاجأة */
function openSurprise() {
  card.style.display = "none";
  surprisePage.style.display = "block";
}

/* سلايدر الصور */
const slides = document.querySelectorAll(".slide");
let current = 0;

setInterval(() => {
  slides[current].classList.remove("active");
  current = (current + 1) % slides.length;
  slides[current].classList.add("active");
}, 3500);
</script>

</body>
</html>
