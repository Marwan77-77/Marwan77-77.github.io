<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>رسالة خاصة 💖</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffb6c1, #ffe4e1);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* شاشة كلمة السر */
#lock {
  background: rgba(255,255,255,0.9);
  padding: 30px;
  border-radius: 20px;
  text-align: center;
}

#lock input {
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  margin-top: 10px;
}

/* الكارت */
.card {
  display: none;
  position: relative;
  background: rgba(255,255,255,0.85);
  padding: 30px;
  border-radius: 20px;
  width: 380px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

/* القلوب */
.heart {
  position: absolute;
  color: #ff6f91;
  animation: float 6s infinite ease-in-out;
  opacity: 0.7;
}

@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
  100% { transform: translateY(0); }
}

button {
  background: #ff6f91;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 20px;
  cursor: pointer;
  margin-top: 15px;
}

/* الهينت */
#hintBtn {
  position: fixed;
  bottom: 12px;
  right: 14px;
  font-size: 12px;
  color: rgba(255,0,0,0.8);
  cursor: pointer;
}
</style>
</head>

<body>

<!-- 🎵 الموسيقى -->
<audio id="bgMusic" preload="auto">
  <source src="song.mp3" type="audio/mpeg">
</audio>

<!-- الهينت -->
<div id="hintBtn" onclick="alert('💡 تلميح: كلمة السر حاجة بينا بس 😉')">
  💡 hint ya habla
</div>

<!-- كلمة السر -->
<div id="lock">
  <h3>💌 كلمة السر</h3>
  <input type="password" id="password" placeholder="اكتبيها هنا">
  <br><br>
  <button onclick="unlock()">دخول</button>
</div>

<!-- الكارت -->
<div class="card" id="card">
  <h2>💗 رسالة ليكي 💗</h2>

  <p>اكتبي هنا الرسالة:</p>
  <textarea style="width:100%;height:90px;border-radius:10px;">
هنا هتكتب كلامك
  </textarea>

  <p>⏳ عدى <span id="days"></span> يوم من أول يوم شفتك فيه</p>

  <button onclick="showSurprise()">اضغطي هنا 🎁</button>
  <button onclick="playMusic()">🎶 شغلي الأغنية</button>

  <div id="surprise" style="display:none;margin-top:15px;">
    💖 مفاجأة من قلبي 💖
  </div>

  <div class="heart" style="top:-10px;left:20px;">❤️</div>
  <div class="heart" style="top:-15px;right:30px;">❤️</div>
  <div class="heart" style="bottom:-10px;left:40px;">❤️</div>
  <div class="heart" style="bottom:-15px;right:20px;">❤️</div>
</div>

<script>
const correctPassword = "ice coffee";

function unlock() {
  const pass = document.getElementById("password").value;
  if (pass === correctPassword) {
    document.getElementById("lock").style.display = "none";
    document.getElementById("card").style.display = "block";

    // محاولة تشغيل تلقائي
    playMusic();
  } else {
    alert("كلمة السر غلط ❌");
  }
}

function playMusic() {
  const music = document.getElementById("bgMusic");
  music.play().catch(() => {
    console.log("اضغطي زر تشغيل الأغنية 🎶");
  });
}

// العداد
const startDate = new Date("2024-01-01");
const today = new Date();
const diffDays = Math.ceil((today - startDate) / (1000*60*60*24));
document.getElementById("days").innerText = diffDays;

function showSurprise() {
  document.getElementById("surprise").style.display = "block";
}
</script>

</body>
</html>
