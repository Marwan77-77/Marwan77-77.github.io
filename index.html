<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>رسالة خاصة 💖</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffb6c1, #ffe4e1);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* الهينت */
#hintBtn {
  position: fixed;
  bottom: 15px;
  left: 15px;
  font-size: 12px;
  color: #fff;
  background: rgba(255,111,145,0.9);
  padding: 6px 10px;
  border-radius: 10px;
  cursor: pointer;
}

/* شاشة كلمة السر */
#lock {
  background: rgba(255,255,255,0.95);
  padding: 30px;
  border-radius: 20px;
  text-align: center;
}

/* الكارت */
.card {
  display: none;
  background: rgba(255,255,255,0.95);
  padding: 30px;
  border-radius: 25px;
  width: 400px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  position: relative;
}

/* قلوب حوالين الكارت */
.card .heart {
  position: absolute;
  font-size: 22px;
}

.card .heart.tl { top: -12px; left: -12px; }
.card .heart.tr { top: -12px; right: -12px; }
.card .heart.bl { bottom: -12px; left: -12px; }
.card .heart.br { bottom: -12px; right: -12px; }

/* زرار */
button {
  background: #ff6f91;
  color: white;
  border: none;
  padding: 12px 22px;
  border-radius: 25px;
  cursor: pointer;
  margin-top: 15px;
}

/* صفحة المفاجأة */
#surprisePage {
  display: none;
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #ffb6c1, #ffe4e1);
  display: flex;
  justify-content: center;
  align-items: center;
}

/* كارت المفاجأة */
.surprise-card {
  background: rgba(255,255,255,0.45);
  border-radius: 35px;
  padding: 40px;
  width: 85%;
  height: 75%;
  position: relative;
  display: flex;
  gap: 40px;
}

/* قلوب صفحة المفاجأة (زي الأولى بالظبط) */
.surprise-card .heart {
  position: absolute;
  font-size: 24px;
}

.surprise-card .heart.tl { top: -15px; left: -15px; }
.surprise-card .heart.tr { top: -15px; right: -15px; }
.surprise-card .heart.bl { bottom: -15px; left: -15px; }
.surprise-card .heart.br { bottom: -15px; right: -15px; }
